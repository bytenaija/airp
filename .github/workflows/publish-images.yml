name: Publish Multi-Arch Container Images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Sign, and Publish Multi-Arch Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingest-gateway
          - changefeed
          - code-index
          - agent-runtime
          - policy-engine
          - rollout-controller
          - demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and generate SBOM
        run: |
          npm ci
          npm run build
          node packages/cli/dist/index.js sbom --output /tmp/sbom.json

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        id: build-push
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bytenaija/airp-${{ matrix.service }}:0.1.0
            ghcr.io/bytenaija/airp-${{ matrix.service }}:latest

      - name: Attach SBOM with Cosign
        run: |
          cosign attach sbom --sbom /tmp/sbom.json \
            ghcr.io/bytenaija/airp-${{ matrix.service }}:0.1.0

      - name: Sign container images with Cosign keyless signing
        run: |
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:0.1.0
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:latest
