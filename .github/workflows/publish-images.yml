name: Publish Multi-Arch Container Images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, Sign, and Publish Multi-Arch Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingest-gateway
          - changefeed
          - code-index
          - agent-runtime
          - policy-engine
          - rollout-controller
          - demo
          - fallback-pager
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Determine image version and tags
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Setup QEMU for multi-arch builds
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and generate SBOM
        run: |
          npm ci --legacy-peer-deps
          npm run build
          node packages/cli/dist/index.js sbom --output /tmp/sbom.json

      - name: Build and push multi-arch image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        id: build-push
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:latest

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@173725a5202368f217de9220ec017757121aa69c # v2.2.3
        with:
          subject-name: ghcr.io/bytenaija/airp-${{ matrix.service }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attach SBOM with Cosign by build digest
        run: |
          cosign attach sbom --sbom /tmp/sbom.json \
            ghcr.io/bytenaija/airp-${{ matrix.service }}@${{ steps.build-push.outputs.digest }}

      - name: Sign container image by build digest with Cosign keyless signing
        run: |
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
