name: Publish Multi-Arch Container Images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, Sign, and Publish Multi-Arch Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingest-gateway
          - changefeed
          - code-index
          - agent-runtime
          - policy-engine
          - rollout-controller
          - demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Determine image version and tags
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Setup QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and generate SBOM
        run: |
          npm ci
          npm run build
          node packages/cli/dist/index.js sbom --output /tmp/sbom.json

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        id: build-push
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/bytenaija/airp-${{ matrix.service }}:latest

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/bytenaija/airp-${{ matrix.service }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attach SBOM with Cosign
        run: |
          cosign attach sbom --sbom /tmp/sbom.json \
            ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}

      - name: Sign container images with Cosign keyless signing
        run: |
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:sha-${{ steps.meta.outputs.sha }}
          cosign sign --yes ghcr.io/bytenaija/airp-${{ matrix.service }}:latest
