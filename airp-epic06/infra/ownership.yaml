version: "1"

services:
  checkout:
    team: checkout-team
    owners:
      - "@team-checkout"
      - "@alice"
    on_call:
      primary: "alice"
      secondary: "bob"
      pagerduty_schedule: "checkout-tier1"
    paths:
      - "demo/src/checkout.ts"
      - "services/checkout/**"

  payments:
    team: payments-team
    owners:
      - "@team-payments"
      - "@maya"
    on_call:
      primary: "maya"
      secondary: "dave"
      pagerduty_schedule: "payments-tier1"
    paths:
      - "demo/src/payments.ts"
      - "services/payments/**"

  fraud-check:
    team: risk-team
    owners:
      - "@team-risk"
      - "@charlie"
    on_call:
      primary: "charlie"
      secondary: "elena"
      pagerduty_schedule: "risk-tier1"
    paths:
      - "demo/src/fraud-check.ts"
      - "services/fraud-check/**"

  platform:
    team: platform-team
    owners:
      - "@team-platform"
      - "@admin"
    on_call:
      primary: "admin"
      secondary: "sre-oncall"
      pagerduty_schedule: "platform-tier1"
    paths:
      - "infra/**"
      - "services/changefeed/**"
      - "services/ingest-gateway/**"
      - "services/code-index/**"

codeowners:
  - pattern: "demo/src/checkout.ts"
    owners: ["@team-checkout"]
    service: "checkout"
  - pattern: "demo/src/payments.ts"
    owners: ["@team-payments"]
    service: "payments"
  - pattern: "demo/src/fraud-check.ts"
    owners: ["@team-risk"]
    service: "fraud-check"
  - pattern: "infra/**"
    owners: ["@team-platform"]
    service: "platform"
  - pattern: "services/changefeed/**"
    owners: ["@team-platform"]
    service: "platform"
  - pattern: "services/ingest-gateway/**"
    owners: ["@team-platform"]
    service: "platform"
  - pattern: "services/code-index/**"
    owners: ["@team-platform"]
    service: "platform"
