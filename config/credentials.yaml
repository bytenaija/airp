version: "1"
roles:
  agent_ro:
    description: "Read-only access: telemetry and code index"
    env_vars:
      - PROMETHEUS_READ_TOKEN
      - LOKI_READ_TOKEN
      - TEMPO_READ_TOKEN
      - CODE_INDEX_READ_TOKEN
    allowed_scopes:
      - "telemetry:read"
      - "code:read"
  actuation_rw:
    description: "Read-write access: VCS, compose orchestration, and feature flags"
    env_vars:
      - GITHUB_TOKEN
      - DOCKER_AUTH_CONFIG
      - FLAGS_ADMIN_TOKEN
    allowed_scopes:
      - "vcs:write"
      - "compose:write"
      - "flags:write"
