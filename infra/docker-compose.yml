version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airp
      POSTGRES_PASSWORD: airp_password
      POSTGRES_DB: airp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airp"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.0.0
    container_name: airp-loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.4.1
    container_name: airp-tempo
    restart: unless-stopped
    user: "0"
    ports:
      - "3200:3200" # HTTP API (search & query)
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: airp-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - app_logs:/var/log/airp:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: airp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.2
    container_name: airp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  demo:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-demo
    restart: unless-stopped
    ports:
      - "8010:8001"
      - "8002:8002"
      - "8003:8003"
    environment:
      - NODE_ENV=production
      - SERVICE=all
      - FAULTS_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - LOG_DIR=/var/log/airp
      - CHECKOUT_PORT=8001
      - PAYMENTS_PORT=8002
      - FRAUD_CHECK_PORT=8003
      - PAYMENTS_URL=http://localhost:8002
      - FRAUD_CHECK_URL=http://localhost:8003
    volumes:
      - app_logs:/var/log/airp
    networks:
      default:
        aliases:
          - checkout-stable
          - payments
          - fraud-check
    depends_on:
      - otel-collector

  checkout-canary:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-checkout-canary
    restart: unless-stopped
    ports:
      - "8011:8001"
    environment:
      - NODE_ENV=production
      - SERVICE=checkout
      - CHECKOUT_PORT=8001
      - SERVICE_VERSION=v1.0.1-canary
      - FAULTS_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - LOG_DIR=/var/log/airp
      - PAYMENTS_URL=http://demo:8002
    volumes:
      - app_logs:/var/log/airp
    networks:
      default:
        aliases:
          - checkout-canary
    depends_on:
      - otel-collector
      - demo

  nginx:
    image: nginx:alpine
    container_name: airp-nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - NGINX_PORT=8001
      - STABLE_UPSTREAM=demo:8001
      - CANARY_UPSTREAM=checkout-canary:8001
      - STABLE_WEIGHT=100
      - STABLE_STATUS=
      - CANARY_WEIGHT=1
      - CANARY_STATUS=down
    volumes:
      - ./canary/nginx-canary.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx_conf:/etc/nginx/conf.d
    networks:
      default:
        aliases:
          - checkout
    depends_on:
      - demo
      - checkout-canary


  changefeed:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-changefeed
    restart: unless-stopped
    command: ["node", "services/changefeed/dist/server.js"]
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=production
      - PORT=8004
      - DATABASE_URL=postgresql://airp:airp_password@postgres:5432/airp
    depends_on:
      postgres:
        condition: service_healthy

  ingest-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-ingest-gateway
    restart: unless-stopped
    command: ["node", "services/ingest-gateway/dist/server.js"]
    ports:
      - "8005:8005"
    environment:
      - NODE_ENV=production
      - PORT=8005
      - DATABASE_URL=postgresql://airp:airp_password@postgres:5432/airp
      - TOPOLOGY_PATH=/app/infra/topology.yaml
    volumes:
      - ./topology.yaml:/app/infra/topology.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  code-index:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-code-index
    restart: unless-stopped
    command: ["node", "services/code-index/dist/server.js"]
    ports:
      - "8006:8006"
    environment:
      - NODE_ENV=production
      - PORT=8006
      - DATABASE_URL=postgresql://airp:airp_password@postgres:5432/airp
      - TOPOLOGY_PATH=/app/infra/topology.yaml
      - OWNERSHIP_PATH=/app/infra/ownership.yaml
      - REPO_PATH=/app/demo
      - RUNBOOKS_PATH=/app/docs/runbooks
    volumes:
      - ./topology.yaml:/app/infra/topology.yaml:ro
      - ./ownership.yaml:/app/infra/ownership.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent-runtime:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-agent-runtime
    restart: unless-stopped
    command: ["node", "services/agent-runtime/dist/server.js"]
    ports:
      - "8007:8007"
    environment:
      - NODE_ENV=production
      - PORT=8007
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_URL=http://prometheus:9090
      - TEMPO_URL=http://tempo:3200
      - CODE_INDEX_URL=http://code-index:8006
      - CHANGEFEED_URL=http://changefeed:8004
      - LLM_PROVIDER=ollama
    depends_on:
      - code-index
      - changefeed
      - ingest-gateway

  policy-engine:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-policy-engine
    restart: unless-stopped
    command: ["node", "services/policy-engine/dist/server.js"]
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=production
      - PORT=8008
      - DATABASE_URL=postgresql://airp:airp_password@postgres:5432/airp
      - OWNERSHIP_PATH=/app/infra/ownership.yaml
      - TIER0_PATH=/app/infra/tier0.yaml
      - ROLLOUT_CONTROLLER_URL=http://rollout-controller:8009
    volumes:
      - ./ownership.yaml:/app/infra/ownership.yaml:ro
      - ./tier0.yaml:/app/infra/tier0.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  rollout-controller:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-rollout-controller
    restart: unless-stopped
    command: ["node", "services/rollout-controller/dist/server.js"]
    ports:
      - "8009:8009"
    environment:
      - NODE_ENV=production
      - PORT=8009
      - NGINX_TEMPLATE_PATH=/app/infra/canary/nginx-canary.conf.template
      - NGINX_OUTPUT_PATH=/etc/nginx/conf.d/default.conf
      - PROMETHEUS_URL=http://prometheus:9090
      - STABLE_UPSTREAM=demo:8001
      - CANARY_UPSTREAM=checkout-canary:8001
      - NGINX_PORT=8001
      - CANARY_REPO_PATH=/app/demo
    volumes:
      - ./canary/nginx-canary.conf.template:/app/infra/canary/nginx-canary.conf.template:ro
      - nginx_conf:/etc/nginx/conf.d
    depends_on:
      - prometheus
      - nginx

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  app_logs:
  nginx_conf:
