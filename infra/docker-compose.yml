version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airp
      POSTGRES_PASSWORD: airp_password
      POSTGRES_DB: airp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airp"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.0.0
    container_name: airp-loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.4.1
    container_name: airp-tempo
    restart: unless-stopped
    user: "0"
    ports:
      - "3200:3200" # HTTP API (search & query)
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: airp-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - app_logs:/var/log/airp:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: airp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.2
    container_name: airp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  demo:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-demo
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    environment:
      - NODE_ENV=production
      - SERVICE=all
      - FAULTS_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - LOG_DIR=/var/log/airp
      - CHECKOUT_PORT=8001
      - PAYMENTS_PORT=8002
      - FRAUD_CHECK_PORT=8003
      - PAYMENTS_URL=http://localhost:8002
      - FRAUD_CHECK_URL=http://localhost:8003
    volumes:
      - app_logs:/var/log/airp
    networks:
      default:
        aliases:
          - checkout
          - payments
          - fraud-check
    depends_on:
      - otel-collector

  changefeed:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airp-changefeed
    restart: unless-stopped
    command: ["node", "services/changefeed/dist/server.js"]
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=production
      - PORT=8004
      - DATABASE_URL=postgresql://airp:airp_password@postgres:5432/airp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  app_logs:
