global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "checkout"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["checkout:8001", "host.docker.internal:8001"]
        labels:
          service: "checkout"

  - job_name: "payments"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payments:8002", "host.docker.internal:8002"]
        labels:
          service: "payments"

  - job_name: "fraud-check"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fraud-check:8003", "host.docker.internal:8003"]
        labels:
          service: "fraud-check"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"

  - job_name: "agent-runtime"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["agent-runtime:8007", "host.docker.internal:8007"]
        labels:
          service: "agent-runtime"
